name: Security & Dependencies

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - "go.mod"
      - "go.sum"
      - ".goreleaser.yaml"
      - "lefthook.yml"

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download Go dependencies
        run: go mod download

      - name: Run vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # TODO: Re-enable gosec when correct repository location is found
      # The securecodewarrior/gosec repository appears to have moved

  dependency-update:
    name: Dependency Update Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Update Go dependencies
        run: |
          go get -u ./...
          go mod tidy

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "files_changed=$(git status --porcelain | wc -l)" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.verify-changed-files.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update Go dependencies"
          title: "chore: automated Go dependency updates"
          body: |
            ## Automated Go Dependency Updates

            This PR was automatically created to update Go dependencies.

            ### Changes
            - 📦 Updated Go dependencies in `tui-prototype/`

            ### Files Changed
            ${{ steps.verify-changed-files.outputs.files_changed }} files were modified.

            ### Next Steps
            1. Review the changes carefully
            2. Run tests locally: `make ci-full`
            3. Check for any breaking changes in updated packages
            4. Merge if tests pass and no issues are found

            ---
            🤖 This PR was created automatically by the dependency update workflow.
          branch: chore/go-dependency-updates
          delete-branch: true
          labels: |
            dependencies
            automated
            chore
            go

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download Go dependencies
        run: go mod download

      - name: Check Go licenses
        run: |
          go run github.com/google/go-licenses@latest report ./... > licenses-report.txt
          echo "## Go Dependencies Licenses" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat licenses-report.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: licenses-report.txt
          retention-days: 30
