name: CI/CD

on:
  push:
    branches: [master, develop]
    tags: ["v*"]
  pull_request:
    branches: [master, develop]

jobs:
  # Go TUI Application CI
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: tui-prototype/go.sum

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('tui-prototype/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install Go tools
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/securecodewarrior/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Download Go dependencies
        working-directory: ./tui-prototype
        run: go mod download

      - name: Verify Go dependencies
        working-directory: ./tui-prototype
        run: go mod verify

      - name: Run go vet
        working-directory: ./tui-prototype
        run: go vet ./...

      - name: Run staticcheck
        working-directory: ./tui-prototype
        run: staticcheck ./...

      - name: Run golangci-lint
        working-directory: ./tui-prototype
        run: golangci-lint run --verbose

      - name: Run security scan
        working-directory: ./tui-prototype
        run: gosec ./...

      - name: Run vulnerability check
        working-directory: ./tui-prototype
        run: govulncheck ./...

      - name: Run tests with coverage
        working-directory: ./tui-prototype
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Generate coverage report
        working-directory: ./tui-prototype
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./tui-prototype/coverage.out
          flags: go-tests
          name: go-coverage

      - name: Run benchmarks
        working-directory: ./tui-prototype
        run: go test -bench=. -benchmem ./...

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: tui-prototype/coverage.html
          retention-days: 30

  # Build Job
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true

      - name: Build snapshot (non-tag pushes)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: goreleaser build --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: go-binaries
          path: dist/
          retention-days: 30

  # Integration Testing
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Download artifacts
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/download-artifact@v4
        with:
          name: go-binaries
          path: dist/

      - name: Make binaries executable
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: find dist -type f -name "arch-installer*" -exec chmod +x {} \;

      - name: Run integration tests
        working-directory: ./tui-prototype
        run: go test -v -tags=integration ./...

      - name: Test Makefile targets
        run: |
          make ci

  # Release Job (only on version tags)
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, integration-test]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
