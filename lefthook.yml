# Lefthook configuration
# Install with: lefthook install
# Documentation: https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    # Go formatting
    go-fmt:
      glob: "*.go"
      run: |
        cd tui-prototype
        go fmt ./...
        git add .

    # Go module tidying
    go-mod-tidy:
      files: git diff --name-only --cached
      glob: "{go.mod,go.sum}"
      run: |
        cd tui-prototype
        go mod tidy
        git add go.mod go.sum

    # Go vetting
    go-vet:
      glob: "*.go"
      run: |
        cd tui-prototype
        go vet ./...

    # Go linting
    golangci-lint:
      glob: "*.go"
      run: |
        cd tui-prototype
        golangci-lint run --fix
        git add .

    # Run tests
    go-test:
      glob: "*.go"
      run: |
        cd tui-prototype
        go test ./...

    # Trailing whitespace and other file checks
    trailing-whitespace:
      glob: "*"
      exclude: |
        \.(git|svg|ico|png|jpg|jpeg|gif|webp|bmp|tiff|psd|pdf|doc|docx|xls|xlsx|ppt|pptx|zip|tar|gz|rar|7z|exe|dmg|pkg|deb|rpm)$
      run: |
        if grep -r '[[:space:]]$' {staged_files}; then
          echo "❌ Found trailing whitespace in staged files"
          exit 1
        fi

    # Check for merge conflicts
    merge-conflicts:
      glob: "*"
      run: |
        if grep -r '<<<<<<< \|=======$\|>>>>>>> ' {staged_files}; then
          echo "❌ Found merge conflict markers in staged files"
          exit 1
        fi

pre-push:
  parallel: true
  commands:
    # Run comprehensive tests before push
    go-test-race:
      run: |
        cd tui-prototype
        go test -race ./...

    # Security scan
    gosec:
      run: |
        cd tui-prototype
        if command -v gosec >/dev/null 2>&1; then
          gosec ./...
        else
          echo "⚠️  gosec not installed, skipping security scan"
        fi

    # Vulnerability check
    govulncheck:
      run: |
        cd tui-prototype
        if command -v govulncheck >/dev/null 2>&1; then
          govulncheck ./...
        else
          echo "⚠️  govulncheck not installed, skipping vulnerability check"
        fi

commit-msg:
  commands:
    # Conventional commit format validation
    commitizen:
      run: |
        # Check if the commit message follows conventional commits format
        commit_regex='^(feat|fix|docs|style|refactor|perf|test|chore|build|ci|revert)(\(.+\))?(!)?: .{1,50}'

        if ! grep -qE "$commit_regex" "$1"; then
          echo ""
          echo "❌ Invalid commit message format!"
          echo ""
          echo "Commit messages must follow the Conventional Commits specification:"
          echo "  <type>[optional scope]: <description>"
          echo ""
          echo "Types: feat, fix, docs, style, refactor, perf, test, chore, build, ci, revert"
          echo ""
          echo "Examples:"
          echo "  feat: add new TUI navigation component"
          echo "  fix(installer): resolve disk partition detection"
          echo "  docs: update installation instructions"
          echo "  feat!: introduce breaking API changes"
          echo ""
          echo "Your commit message:"
          echo "  $(head -n1 $1)"
          echo ""
          exit 1
        fi

        # Check commit message length
        if [ $(head -n1 "$1" | wc -c) -gt 72 ]; then
          echo "❌ Commit message is too long (> 72 characters)"
          echo "Current length: $(head -n1 "$1" | wc -c) characters"
          echo "Your commit message:"
          echo "  $(head -n1 $1)"
          exit 1
        fi

# Skip lefthook execution for merge commits
skip_output:
  - meta
  - execution

colors: true

output:
  - execution_out
  - execution_info
  - summary
