services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arch-base-dev
    hostname: arch-dev

    # Privileged mode for system-level testing
    privileged: true

    # Environment variables
    environment:
      - GOOS=linux
      - GOARCH=amd64
      - CGO_ENABLED=0
      - GO111MODULE=on
      - GOPROXY=https://proxy.golang.org,direct
      - GOSUMDB=sum.golang.org
      - TZ=UTC

    # Volume mounts
    volumes:
      - ../:/workspace:cached
      - go-mod-cache:/go/pkg/mod
      - vscode-server:/home/vscode/.vscode-server
      - /var/run/docker.sock:/var/run/docker.sock

    # Port forwarding
    ports:
      - "8080:8080" # Development server
      - "9000:9000" # Debug port
      - "2345:2345" # Delve debugger

    # Working directory
    working_dir: /workspace

    # Keep container running (override Dockerfile CMD)
    command: ["sleep", "infinity"]

    # Networks
    networks:
      - arch-dev-network

volumes:
  go-mod-cache:
    name: arch-base-go-mod-cache
  vscode-server:
    name: arch-base-vscode-server

networks:
  arch-dev-network:
    name: arch-dev-network
    driver: bridge
