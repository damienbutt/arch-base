# GPG configuration for development container
# This ensures GPG works properly in the containerized environment

# Use the console for TTY
pinentry-mode loopback

# Trust the imported keys
trust-model always

# Disable the use of the terminal
no-tty

# Use batch mode for non-interactive operations
batch

# Keyserver configuration (optional)
keyserver hkps://keys.openpgp.org
keyserver-options auto-key-retrieve
